<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A574"/>
      <stop offset="50%" stop-color="#C8A4C8"/>
      <stop offset="100%" stop-color="#9B6B9B"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#AA7744"/>
    </linearGradient>
  </defs>
  
  <!-- Flower / Iris Icon -->
  <g transform="translate(10, 10)">
    <path d="M40,10 C55,25 55,45 40,65 C25,45 25,25 40,10 Z" fill="url(#logo-grad)" opacity="0.95"/>
    <path d="M20,40 C35,25 55,25 70,40 C55,55 35,55 20,40 Z" fill="url(#logo-grad)" opacity="0.75"/>
    <circle cx="40" cy="40" r="8" fill="url(#gold-grad)"/>
    <path d="M40,22 L40,58 M22,40 L58,40" stroke="#FFF" stroke-width="1.5" opacity="0.6"/>
  </g>
  
  <!-- Typography -->
  <text x="95" y="48" font-family="'Cormorant Garamond', 'Times New Roman', serif" font-size="34" font-weight="700" letter-spacing="3" fill="#2D2D2D">
    DERMA <tspan fill="url(#gold-grad)">IRIS</tspan>
  </text>
  <text x="96" y="68" font-family="'Lato', sans-serif" font-size="11" font-weight="400" letter-spacing="6" fill="#8A7A8A">
    SKINCARE JORDAN
  </text>
</svg>
